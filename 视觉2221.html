<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>XSimple - Geometric Interaction System</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; color: #D4AF37; font-family: 'Times New Roman', serif; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        #video-feed { position: absolute; bottom: 20px; right: 20px; width: 200px; height: 150px; z-index: 2; opacity: 0.5; border: 1px solid #D4AF37; transform: scaleX(-1); }
        #ui-layer { position: absolute; top: 20px; left: 20px; z-index: 3; pointer-events: none; }
        #documents-ui { 
            position: absolute; 
            top: 100px; 
            left: 20px; 
            z-index: 4; 
            background: rgba(5, 5, 5, 0.9); 
            border: 1px solid #D4AF37; 
            padding: 15px;
            width: 300px;
            max-height: 70vh;
            overflow-y: auto;
            pointer-events: auto;
            display: none;
        }
        h1 { font-weight: 100; letter-spacing: 5px; text-transform: uppercase; border-bottom: 1px solid #D4AF37; display: inline-block; }
        .status { font-size: 14px; margin-top: 10px; opacity: 0.8; }
        .document-item { 
            padding: 10px; 
            margin: 5px 0; 
            border: 1px solid rgba(212, 175, 55, 0.3); 
            cursor: pointer; 
            transition: all 0.3s;
            font-size: 14px;
            position: relative;
        }
        .document-item:hover { 
            border-color: #D4AF37; 
            background: rgba(212, 175, 55, 0.1);
        }
        .document-item.active { 
            border-color: #D4AF37; 
            background: rgba(212, 175, 55, 0.2);
        }
        .document-item.selected { 
            border-color: #FFD700; 
            background: rgba(255, 215, 0, 0.1);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(255, 215, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0); }
        }
        .document-path { 
            font-size: 12px; 
            color: #8B7500; 
            margin-top: 5px;
            word-break: break-all;
        }
        .close-btn { 
            position: absolute; 
            top: 5px; 
            right: 10px; 
            cursor: pointer; 
            font-size: 20px;
            color: #D4AF37;
        }
        #text-content { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%);
            width: 80%;
            height: 70%;
            background: rgba(5, 5, 5, 0.95);
            border: 2px solid #D4AF37;
            padding: 30px;
            z-index: 5;
            display: none;
            overflow-y: auto;
            color: #D4AF37;
            font-family: 'Times New Roman', serif;
            line-height: 1.6;
        }
        #text-content h2 { 
            border-bottom: 1px solid #D4AF37; 
            padding-bottom: 10px; 
            margin-top: 0;
        }
        .close-text-btn { 
            position: absolute; 
            top: 10px; 
            right: 15px; 
            cursor: pointer; 
            font-size: 24px;
        }
        #file-explorer-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 6;
            background: rgba(5, 5, 5, 0.8);
            border: 1px solid #D4AF37;
            color: #D4AF37;
            padding: 10px 20px;
            cursor: pointer;
            font-family: 'Times New Roman', serif;
            font-size: 14px;
            letter-spacing: 2px;
            transition: all 0.3s;
        }
        #file-explorer-btn:hover {
            background: rgba(212, 175, 55, 0.1);
        }
        #cursor {
            position: absolute;
            width: 20px;
            height: 20px;
            background: rgba(255, 215, 0, 0.7);
            border: 2px solid #FFD700;
            border-radius: 50%;
            z-index: 7;
            pointer-events: none;
            display: none;
            transform: translate(-50%, -50%);
        }
        #cursor::before {
            content: '';
            position: absolute;
            width: 30px;
            height: 30px;
            border: 1px solid #D4AF37;
            border-radius: 50%;
            top: -7px;
            left: -7px;
            opacity: 0.5;
        }
        .gesture-hint {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-size: 12px;
            color: rgba(212, 175, 55, 0.7);
            z-index: 3;
            background: rgba(5, 5, 5, 0.8);
            padding: 10px;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }
        #selection-line {
            position: absolute;
            background: linear-gradient(90deg, transparent, #FFD700, transparent);
            height: 2px;
            z-index: 6;
            pointer-events: none;
            opacity: 0;
            transform-origin: 0 0;
        }
        #control-mode {
            position: absolute;
            top: 20px;
            right: 200px;
            z-index: 3;
            background: rgba(5, 5, 5, 0.8);
            border: 1px solid #D4AF37;
            color: #D4AF37;
            padding: 10px;
            font-size: 12px;
        }
        .shake-effect {
            animation: shake 0.5s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-10px); }
            20%, 40%, 60%, 80% { transform: translateX(10px); }
        }
        .gesture-warning {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(139, 0, 0, 0.9);
            border: 2px solid #FF4444;
            padding: 30px;
            color: #FFD700;
            z-index: 10;
            display: none;
            font-size: 18px;
            text-align: center;
            max-width: 400px;
        }
        #reset-confirm {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(5, 5, 5, 0.95);
            border: 2px solid #D4AF37;
            padding: 30px;
            color: #D4AF37;
            z-index: 10;
            display: none;
            max-width: 400px;
            text-align: center;
        }
        .confirm-btn {
            background: rgba(212, 175, 55, 0.2);
            border: 1px solid #D4AF37;
            color: #D4AF37;
            padding: 10px 20px;
            margin: 10px;
            cursor: pointer;
            font-family: 'Times New Roman', serif;
            transition: all 0.3s;
        }
        .confirm-btn:hover {
            background: rgba(212, 175, 55, 0.4);
        }
        .gesture-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #FF4444;
            font-size: 48px;
            z-index: 9;
            opacity: 0;
            pointer-events: none;
        }
    </style>
    <!-- 引入 Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- 引入 MediaPipe -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <!-- 引入 GSAP 用于动画 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
</head>
<body>

    <div id="ui-layer">
        <h1>XSimple Archive</h1>
        <div class="status" id="status-text">系统初始化... 等待手势指令</div>
        <div class="status" id="gesture-status">手势: 无</div>
    </div>

    <!-- 控制模式显示 -->
    <div id="control-mode">模式: 视图控制</div>

    <!-- 文档列表UI -->
    <div id="documents-ui">
        <div class="close-btn" id="close-docs-btn">×</div>
        <h3>文档库</h3>
        <div id="documents-list">
            <!-- 文档列表会动态生成 -->
        </div>
    </div>

    <!-- 文本内容显示 -->
    <div id="text-content">
        <div class="close-text-btn" id="close-text-btn">×</div>
        <h2 id="text-title">文档标题</h2>
        <div id="text-body"></div>
    </div>

    <!-- 手势光标 -->
    <div id="cursor"></div>
    
    <!-- 选择线 -->
    <div id="selection-line"></div>

    <!-- 文件管理器按钮 -->
    <button id="file-explorer-btn">📁 打开文档库</button>

    <!-- 手势提示 -->
    <div class="gesture-hint">
        <div>👆 单手指: 移动视图</div>
        <div>🤞 两指靠近: 切换光标模式</div>
        <div>👌 OK手势: 选中并打开文档</div>
        <div>✊ 握拳: 3D模式</div>
        <div>🖐️ 张开: 2D阅读</div>
        <div>🤏 拇食指: 缩放</div>
        <div>💨 快速甩手: 关闭所有页面</div>
        <div>↔️ 左右甩手: 禁用/启用手势</div>
    </div>

    <!-- 手势警告 -->
    <div class="gesture-warning" id="gesture-warning">
        手势控制已禁用<br>
        <span style="font-size: 14px;">做出"👌 OK手势"重新启用手势控制</span>
    </div>

    <!-- 重置确认框 -->
    <div id="reset-confirm">
        <h3>确认关闭所有页面</h3>
        <p>您确定要关闭所有打开的页面吗？</p>
        <button class="confirm-btn" id="confirm-reset">确认关闭</button>
        <button class="confirm-btn" id="cancel-reset">取消</button>
    </div>

    <!-- 手势指示器 -->
    <div class="gesture-indicator" id="shake-indicator">💨</div>
    <div class="gesture-indicator" id="swipe-indicator">↔️</div>

    <!-- 摄像头画面 -->
    <video id="video-feed" playsinline></video>
    
    <!-- 3D 渲染容器 -->
    <div id="canvas-container"></div>

<script>
    // --- 1. Three.js 场景初始化 ---
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050505, 0.002);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 20;
    camera.position.y = 0;
    camera.position.x = 0;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    // --- 2. 手势控制状态 ---
    let gestureState = {
        mode: 'view', // 'view' 或 'cursor'
        isTwoFingersClose: false,
        lastHandPosition: { x: 0, y: 0 },
        cursorPosition: { x: window.innerWidth/2, y: window.innerHeight/2 },
        scrollSpeed: { x: 0, y: 0 },
        lastOkGestureTime: 0,
        
        // 甩手检测相关
        handHistory: [],
        historySize: 10,
        lastShakeTime: 0,
        shakeCooldown: 1000, // 甩手冷却时间
        
        // 左右甩手相关
        lastSwipeTime: 0,
        swipeCooldown: 1500,
        horizontalVelocityHistory: [],
        
        // 手势控制状态
        gestureEnabled: true,
        
        // 手势敏感度
        shakeThreshold: 0.15, // 甩手速度阈值
        swipeThreshold: 0.1,  // 甩动阈值
        consecutiveSwipesNeeded: 2 // 需要连续检测到的甩动次数
    };

    // --- 3. 文档数据管理 ---
    const documents = [
        {
            id: 1,
            title: "几何原本",
            path: "/documents/geometry/origin.txt",
            content: "《几何原本》是古希腊数学家欧几里得所著的一部数学著作，共13卷。这部书是现代数学的基础，在西方是仅次于《圣经》而流传最广的书籍。\n\n第一卷：定义、公设、公理\n第二卷：几何代数的基本原理\n第三卷：圆与弦、切线、圆心角\n第四卷：正多边形\n第五卷：比例论\n第六卷：相似形\n第七至九卷：数论\n第十卷：不可公度量\n第十一至十三卷：立体几何",
            category: "数学",
            position: { x: 0, y: 0 }
        },
        {
            id: 2,
            title: "天体运行论",
            path: "/documents/astronomy/celestial.txt",
            content: "《天体运行论》是波兰天文学家哥白尼所著的一本书籍，于1543年出版。书中提出了日心说模型，挑战了当时的地心说理论。\n\n核心论点：\n1. 太阳是宇宙的中心\n2. 地球和其他行星围绕太阳运行\n3. 地球每天自转一周\n4. 月亮围绕地球运行\n\n本书标志着科学革命的开端，对后世天文学和物理学产生了深远影响。",
            category: "天文学",
            position: { x: 25, y: 0 }
        },
        {
            id: 3,
            title: "哲学手稿",
            path: "/documents/philosophy/manuscript.txt",
            content: "古希腊哲学家对存在、知识和价值的思考构成了西方哲学的基础。\n\n苏格拉底：认识你自己\n柏拉图：理念论\n亚里士多德：形而上学\n\n这些思想影响了整个西方文明的发展，并在科学、政治和伦理等领域产生了深远影响。",
            category: "哲学",
            position: { x: -25, y: 0 }
        },
        {
            id: 4,
            title: "数学原理",
            path: "/documents/mathematics/principles.txt",
            content: "牛顿的《自然哲学的数学原理》发表于1687年，是现代物理学的基石。\n\n三大运动定律：\n1. 惯性定律\n2. 加速度定律\n3. 作用与反作用定律\n\n万有引力定律：任何两个质点都存在通过其连心线方向上的相互吸引的力。",
            category: "物理学",
            position: { x: 0, y: 15 }
        },
        {
            id: 5,
            title: "建筑十书",
            path: "/documents/architecture/vitruvius.txt",
            content: "维特鲁威的《建筑十书》是古罗马时期最重要的建筑理论著作，对文艺复兴时期的建筑产生了深远影响。\n\n核心概念：\n- 坚固\n- 实用\n- 美观\n- 对称与比例",
            category: "建筑学",
            position: { x: 20, y: -15 }
        }
    ];

    // --- 4. 创建文档节点 ---
    const documentNodes = [];
    const nodeMaterial = new THREE.MeshBasicMaterial({ 
        color: 0xD4AF37, 
        wireframe: true,
        transparent: true,
        opacity: 0.6
    });

    documents.forEach((doc, index) => {
        const geometry = new THREE.OctahedronGeometry(2, 0);
        const node = new THREE.Mesh(geometry, nodeMaterial);
        node.position.set(doc.position.x, doc.position.y, 0);
        node.userData = { document: doc };
        scene.add(node);
        documentNodes.push(node);
        
        // 添加标签
        const canvas = document.createElement('canvas');
        canvas.width = 256;
        canvas.height = 64;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#050505';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.font = '16px "Times New Roman"';
        ctx.fillStyle = '#D4AF37';
        ctx.textAlign = 'center';
        ctx.fillText(doc.title, canvas.width/2, canvas.height/2);
        
        const texture = new THREE.CanvasTexture(canvas);
        const labelMaterial = new THREE.SpriteMaterial({ map: texture });
        const sprite = new THREE.Sprite(labelMaterial);
        sprite.scale.set(8, 2, 1);
        sprite.position.set(doc.position.x, doc.position.y + 3, 0);
        scene.add(sprite);
    });

    let currentDocument = documents[0];
    let currentTextScale = 1;
    let selectedDocument = null;

    // --- 5. 创建主文档几何对象 ---
    const docMaterial = new THREE.MeshBasicMaterial({ 
        color: 0xD4AF37, 
        wireframe: true,
        transparent: true,
        opacity: 0.8
    });

    const textGeometry = new THREE.PlaneGeometry(10, 8, 10, 10);
    const textMesh = new THREE.Mesh(textGeometry, docMaterial);
    textMesh.position.set(0, 0, 5);
    
    const sphereGeometry = new THREE.IcosahedronGeometry(5, 2);
    const sphereMesh = new THREE.Mesh(sphereGeometry, docMaterial);
    sphereMesh.visible = false;

    const docGroup = new THREE.Group();
    docGroup.add(textMesh);
    docGroup.add(sphereMesh);
    scene.add(docGroup);

    // --- 6. 甩手检测函数 ---
    function detectShakeGesture(handCenter) {
        const now = Date.now();
        
        // 添加当前手部位置到历史记录
        gestureState.handHistory.push({
            x: handCenter.x,
            y: handCenter.y,
            time: now
        });
        
        // 保持历史记录大小
        if (gestureState.handHistory.length > gestureState.historySize) {
            gestureState.handHistory.shift();
        }
        
        // 需要足够的历史数据
        if (gestureState.handHistory.length < 5) return false;
        
        // 计算速度
        const oldest = gestureState.handHistory[0];
        const newest = gestureState.handHistory[gestureState.handHistory.length - 1];
        
        const timeDiff = newest.time - oldest.time;
        if (timeDiff === 0) return false;
        
        const distanceX = Math.abs(newest.x - oldest.x);
        const distanceY = Math.abs(newest.y - oldest.y);
        const velocityX = distanceX / timeDiff * 1000; // 转换为每秒像素
        const velocityY = distanceY / timeDiff * 1000;
        
        // 检测快速甩手（快速移动）
        if ((velocityX > gestureState.shakeThreshold || velocityY > gestureState.shakeThreshold) && 
            now - gestureState.lastShakeTime > gestureState.shakeCooldown) {
            
            // 检查是否真的是"甩"的动作（加速度）
            let accelerationSum = 0;
            for (let i = 1; i < gestureState.handHistory.length - 1; i++) {
                const prev = gestureState.handHistory[i - 1];
                const curr = gestureState.handHistory[i];
                const next = gestureState.handHistory[i + 1];
                
                const vel1 = Math.abs(curr.x - prev.x) / (curr.time - prev.time) * 1000;
                const vel2 = Math.abs(next.x - curr.x) / (next.time - curr.time) * 1000;
                accelerationSum += Math.abs(vel2 - vel1);
            }
            
            const avgAcceleration = accelerationSum / (gestureState.handHistory.length - 2);
            
            if (avgAcceleration > gestureState.shakeThreshold * 2) {
                gestureState.lastShakeTime = now;
                return true;
            }
        }
        
        return false;
    }

    // --- 7. 左右甩手检测函数 ---
    function detectSwipeGesture(handCenter) {
        const now = Date.now();
        
        // 计算水平速度
        if (gestureState.lastHandPosition.x !== 0) {
            const deltaX = handCenter.x - gestureState.lastHandPosition.x;
            const timeDelta = now - gestureState.lastSwipeTime;
            
            if (timeDelta > 0) {
                const velocityX = Math.abs(deltaX) / timeDelta * 1000;
                gestureState.horizontalVelocityHistory.push(velocityX);
                
                // 保持历史记录大小
                if (gestureState.horizontalVelocityHistory.length > 5) {
                    gestureState.horizontalVelocityHistory.shift();
                }
                
                // 检测快速左右甩动
                if (gestureState.horizontalVelocityHistory.length >= 3) {
                    let consecutiveFastMoves = 0;
                    for (let i = 0; i < gestureState.horizontalVelocityHistory.length; i++) {
                        if (gestureState.horizontalVelocityHistory[i] > gestureState.swipeThreshold) {
                            consecutiveFastMoves++;
                        } else {
                            consecutiveFastMoves = 0;
                        }
                        
                        // 检测到连续快速移动
                        if (consecutiveFastMoves >= gestureState.consecutiveSwipesNeeded && 
                            now - gestureState.lastSwipeTime > gestureState.swipeCooldown) {
                            gestureState.lastSwipeTime = now;
                            gestureState.horizontalVelocityHistory = [];
                            return true;
                        }
                    }
                }
            }
        }
        
        gestureState.lastSwipeTime = now;
        return false;
    }

    // --- 8. 关闭所有页面函数 ---
    function closeAllPages() {
        // 显示确认框
        document.getElementById('reset-confirm').style.display = 'block';
        
        // 添加抖动效果
        document.body.classList.add('shake-effect');
        setTimeout(() => {
            document.body.classList.remove('shake-effect');
        }, 500);
        
        // 显示甩手指示器
        const indicator = document.getElementById('shake-indicator');
        indicator.style.opacity = '1';
        gsap.to(indicator, {
            scale: 2,
            duration: 0.3,
            yoyo: true,
            repeat: 1,
            onComplete: () => {
                indicator.style.opacity = '0';
                indicator.style.scale = '1';
            }
        });
    }

    // --- 9. 执行关闭所有页面 ---
    function performCloseAll() {
        // 关闭文档列表
        document.getElementById('documents-ui').style.display = 'none';
        
        // 关闭文本内容
        gsap.to('#text-content', {display: 'none', opacity: 0, duration: 0.3});
        
        // 重置文档选择
        selectedDocument = null;
        documentNodes.forEach(node => {
            node.material.color.setHex(0xD4AF37);
            node.scale.setScalar(1);
        });
        
        // 重置到初始视图
        gsap.to(camera.position, {
            x: 0,
            y: 0,
            z: 20,
            duration: 1,
            ease: "power2.out"
        });
        
        // 重置手势状态
        gestureState.mode = 'view';
        document.getElementById('cursor').style.display = 'none';
        document.getElementById('control-mode').textContent = '模式: 视图控制';
        
        // 更新状态
        document.getElementById('status-text').textContent = '所有页面已关闭 - 系统重置';
        document.getElementById('gesture-status').textContent = '手势: 无';
        
        // 隐藏确认框
        document.getElementById('reset-confirm').style.display = 'none';
        
        // 重置文档显示
        updateDocumentDisplay(currentDocument);
        loadDocumentsList();
    }

    // --- 10. 切换手势控制状态 ---
    function toggleGestureControl() {
        gestureState.gestureEnabled = !gestureState.gestureEnabled;
        
        const warning = document.getElementById('gesture-warning');
        
        if (!gestureState.gestureEnabled) {
            // 禁用手势控制
            warning.style.display = 'block';
            document.getElementById('status-text').textContent = '手势控制已禁用';
            document.getElementById('gesture-status').textContent = '手势: 禁用';
            
            // 显示左右甩指示器
            const indicator = document.getElementById('swipe-indicator');
            indicator.style.opacity = '1';
            gsap.to(indicator, {
                rotation: 360,
                duration: 0.5,
                ease: "power2.out",
                onComplete: () => {
                    indicator.style.opacity = '0';
                }
            });
        } else {
            // 启用手势控制
            warning.style.display = 'none';
            document.getElementById('status-text').textContent = '手势控制已启用';
            document.getElementById('gesture-status').textContent = '手势: 重新启用';
        }
    }

    // --- 11. UI 交互 ---
    document.getElementById('file-explorer-btn').addEventListener('click', () => {
        const docsUI = document.getElementById('documents-ui');
        const isVisible = docsUI.style.display === 'block';
        docsUI.style.display = isVisible ? 'none' : 'block';
        
        if(!isVisible) {
            loadDocumentsList();
        }
    });

    document.getElementById('close-docs-btn').addEventListener('click', () => {
        document.getElementById('documents-ui').style.display = 'none';
    });

    document.getElementById('close-text-btn').addEventListener('click', () => {
        gsap.to('#text-content', {display: 'none', opacity: 0, duration: 0.3});
    });

    // 重置确认按钮
    document.getElementById('confirm-reset').addEventListener('click', () => {
        performCloseAll();
    });

    document.getElementById('cancel-reset').addEventListener('click', () => {
        document.getElementById('reset-confirm').style.display = 'none';
    });

    // 使用OK手势重新启用手势控制
    function checkGestureReenable(landmarks) {
        if (!gestureState.gestureEnabled) {
            const isOKGesture = detectOKGesture(landmarks);
            if (isOKGesture) {
                gestureState.gestureEnabled = true;
                document.getElementById('gesture-warning').style.display = 'none';
                document.getElementById('status-text').textContent = '手势控制已重新启用';
                document.getElementById('gesture-status').textContent = '手势: 正常';
                
                // 视觉反馈
                gsap.to('#cursor', {
                    backgroundColor: 'rgba(0, 255, 0, 0.7)',
                    duration: 0.5,
                    yoyo: true,
                    repeat: 1
                });
            }
        }
    }

    function loadDocumentsList() {
        const listContainer = document.getElementById('documents-list');
        listContainer.innerHTML = '';
        
        documents.forEach(doc => {
            const div = document.createElement('div');
            div.className = `document-item ${currentDocument.id === doc.id ? 'active' : ''} ${selectedDocument?.id === doc.id ? 'selected' : ''}`;
            div.dataset.id = doc.id;
            div.innerHTML = `
                <div><strong>${doc.title}</strong></div>
                <div class="document-path">${doc.path}</div>
                <div style="font-size: 11px; color: #8B7500; margin-top: 5px;">类别: ${doc.category}</div>
            `;
            
            div.addEventListener('click', () => {
                updateDocumentDisplay(doc);
            });
            
            listContainer.appendChild(div);
        });
    }

    // --- 12. 更新文档显示 ---
    function updateDocumentDisplay(doc) {
        currentDocument = doc;
        
        document.querySelectorAll('.document-item').forEach(item => {
            item.classList.remove('active');
            if(parseInt(item.dataset.id) === doc.id) {
                item.classList.add('active');
            }
        });
        
        document.getElementById('text-title').textContent = doc.title;
        document.getElementById('text-body').textContent = doc.content;
        
        gsap.to(camera.position, {
            x: doc.position.x,
            y: doc.position.y,
            duration: 1,
            ease: "power2.out"
        });
        
        if(targetShape === 'plane') {
            gsap.to('#text-content', {display: 'block', opacity: 1, duration: 0.5});
        }
    }

    // --- 13. 手势选择文档 ---
    function selectDocumentWithCursor() {
        if (!gestureState.cursorPosition) return;
        
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        
        mouse.x = (gestureState.cursorPosition.x / window.innerWidth) * 2 - 1;
        mouse.y = -(gestureState.cursorPosition.y / window.innerHeight) * 2 + 1;
        
        raycaster.setFromCamera(mouse, camera);
        
        const intersects = raycaster.intersectObjects(documentNodes);
        
        if (intersects.length > 0) {
            const selectedNode = intersects[0].object;
            const doc = selectedNode.userData.document;
            
            if (selectedDocument?.id !== doc.id) {
                selectedDocument = doc;
                
                documentNodes.forEach(node => {
                    node.material.color.setHex(node.userData.document.id === doc.id ? 0xFFD700 : 0xD4AF37);
                    node.scale.setScalar(node.userData.document.id === doc.id ? 1.2 : 1);
                });
                
                loadDocumentsList();
                document.getElementById('status-text').textContent = `已选中: ${doc.title}`;
                showSelectionFeedback(gestureState.cursorPosition);
            }
        }
    }

    function openSelectedDocument() {
        if (selectedDocument) {
            updateDocumentDisplay(selectedDocument);
            
            documentNodes.forEach(node => {
                if (node.userData.document.id === selectedDocument.id) {
                    gsap.to(node.material.color, {
                        r: 1,
                        g: 1,
                        b: 0,
                        duration: 0.3,
                        yoyo: true,
                        repeat: 2
                    });
                }
            });
            
            document.getElementById('status-text').textContent = `已打开: ${selectedDocument.title}`;
        }
    }

    function showSelectionFeedback(position) {
        const line = document.getElementById('selection-line');
        line.style.left = `${position.x}px`;
        line.style.top = `${position.y}px`;
        line.style.width = '100px';
        line.style.opacity = '1';
        
        gsap.to(line, {
            rotation: Math.PI * 2,
            duration: 1,
            ease: "power2.out",
            onComplete: () => {
                line.style.opacity = '0';
            }
        });
    }

    // --- 14. 手势检测函数 ---
    function detectOKGesture(landmarks) {
        const thumbTip = landmarks[4];
        const indexTip = landmarks[8];
        const middleTip = landmarks[12];
        const ringTip = landmarks[16];
        const pinkyTip = landmarks[20];
        const wrist = landmarks[0];
        
        const dist = (p1, p2) => Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2));
        
        const thumbIndexDist = dist(thumbTip, indexTip);
        const middleDist = dist(middleTip, wrist);
        const ringDist = dist(ringTip, wrist);
        const pinkyDist = dist(pinkyTip, wrist);
        
        return thumbIndexDist < 0.05 && 
               middleDist > thumbIndexDist * 3 &&
               ringDist > thumbIndexDist * 3 &&
               pinkyDist > thumbIndexDist * 3;
    }

    function detectTwoFingersClose(landmarks) {
        const middleTip = landmarks[12];
        const ringTip = landmarks[16];
        const dist = (p1, p2) => Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2));
        
        return dist(middleTip, ringTip) < 0.03;
    }

    function getHandCenter(landmarks) {
        let sumX = 0, sumY = 0;
        landmarks.forEach(point => {
            sumX += point.x;
            sumY += point.y;
        });
        return {
            x: sumX / landmarks.length,
            y: sumY / landmarks.length
        };
    }

    // --- 15. 星空背景 ---
    const starGeo = new THREE.BufferGeometry();
    const starCount = 3000;
    const starPos = new Float32Array(starCount * 3);
    for(let i=0; i<starCount*3; i++) {
        starPos[i] = (Math.random() - 0.5) * 300;
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    const starMat = new THREE.PointsMaterial({color: 0xFFFFFF, size: 0.1});
    const stars = new THREE.Points(starGeo, starMat);
    scene.add(stars);

    // --- 16. 逻辑控制变量 ---
    let targetShape = 'plane';
    
    // --- 17. 动画循环 ---
    function animate() {
        requestAnimationFrame(animate);
        
        stars.rotation.y += 0.0003;
        
        if (gestureState.gestureEnabled) {
            camera.position.x += gestureState.scrollSpeed.x;
            camera.position.y += gestureState.scrollSpeed.y;
            gestureState.scrollSpeed.x *= 0.95;
            gestureState.scrollSpeed.y *= 0.95;
        }
        
        if(targetShape === 'sphere') {
            docGroup.rotation.y += 0.01;
            docGroup.rotation.x += 0.005;
        }
        
        documentNodes.forEach(node => {
            node.rotation.y += 0.01;
            node.rotation.x += 0.005;
        });

        renderer.render(scene, camera);
    }
    animate();

    // --- 18. MediaPipe 手势识别逻辑 ---
    const videoElement = document.getElementById('video-feed');
    const statusText = document.getElementById('status-text');
    const gestureStatus = document.getElementById('gesture-status');
    const controlMode = document.getElementById('control-mode');
    const cursor = document.getElementById('cursor');

    function onResults(results) {
        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
            const landmarks = results.multiHandLandmarks[0];
            const handCenter = getHandCenter(landmarks);
            
            // 检查是否需要重新启用手势控制
            checkGestureReenable(landmarks);
            
            // 如果手势控制被禁用，只检查重新启用
            if (!gestureState.gestureEnabled) return;
            
            // --- 检测甩手势 ---
            if (detectShakeGesture(handCenter)) {
                closeAllPages();
                return;
            }
            
            // --- 检测左右甩手势 ---
            if (detectSwipeGesture(handCenter)) {
                toggleGestureControl();
                return;
            }
            
            const isOKGesture = detectOKGesture(landmarks);
            const twoFingersClose = detectTwoFingersClose(landmarks);
            
            // --- 处理两指靠近模式切换 ---
            if (twoFingersClose && !gestureState.isTwoFingersClose) {
                gestureState.mode = gestureState.mode === 'view' ? 'cursor' : 'view';
                gestureState.isTwoFingersClose = true;
                
                controlMode.textContent = `模式: ${gestureState.mode === 'view' ? '视图控制' : '光标控制'}`;
                cursor.style.display = gestureState.mode === 'cursor' ? 'block' : 'none';
                
                gsap.to(cursor, {
                    scale: 1.5,
                    duration: 0.3,
                    yoyo: true,
                    repeat: 1
                });
            } else if (!twoFingersClose) {
                gestureState.isTwoFingersClose = false;
            }
            
            // --- 视图控制模式 ---
            if (gestureState.mode === 'view') {
                const deltaX = (handCenter.x - gestureState.lastHandPosition.x) * 50;
                const deltaY = (handCenter.y - gestureState.lastHandPosition.y) * -50;
                
                gestureState.scrollSpeed.x = deltaX * 0.1;
                gestureState.scrollSpeed.y = deltaY * 0.1;
                
                gestureStatus.textContent = "手势: 视图控制";
            } 
            // --- 光标控制模式 ---
            else if (gestureState.mode === 'cursor') {
                gestureState.cursorPosition.x = handCenter.x * window.innerWidth;
                gestureState.cursorPosition.y = handCenter.y * window.innerHeight;
                
                cursor.style.left = `${gestureState.cursorPosition.x}px`;
                cursor.style.top = `${gestureState.cursorPosition.y}px`;
                
                selectDocumentWithCursor();
                gestureStatus.textContent = "手势: 光标控制";
            }
            
            gestureState.lastHandPosition = handCenter;
            
            // --- 处理OK手势 ---
            if (isOKGesture) {
                const now = Date.now();
                if (now - gestureState.lastOkGestureTime > 1000) {
                    gestureState.lastOkGestureTime = now;
                    openSelectedDocument();
                    
                    gsap.to(cursor, {
                        backgroundColor: 'rgba(0, 255, 0, 0.7)',
                        duration: 0.2,
                        yoyo: true,
                        repeat: 1
                    });
                }
            }
            
            // --- 握拳/张开检测 ---
            const tips = [8, 12, 16, 20];
            const bases = [5, 9, 13, 17];
            let foldedCount = 0;
            
            const dist = (p1, p2) => Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2));
            const wrist = landmarks[0];

            tips.forEach((tipIdx, i) => {
                if (dist(landmarks[tipIdx], wrist) < dist(landmarks[bases[i]], wrist)) {
                    foldedCount++;
                }
            });

            const isFist = foldedCount >= 3;

            // --- 状态切换与变形 ---
            if (isFist && targetShape !== 'sphere') {
                targetShape = 'sphere';
                statusText.innerText = `状态: 3D折叠 (握拳) - ${currentDocument.title}`;
                transformToSphere();
            } else if (!isFist && targetShape !== 'plane') {
                targetShape = 'plane';
                statusText.innerText = `状态: 2D阅读 (张开) - ${currentDocument.title}`;
                transformToPlane();
            }

            // --- 手势操控大小 (拇食指距离) ---
            const thumbTip = landmarks[4];
            const indexTip = landmarks[8];
            const pinchDist = dist(thumbTip, indexTip);
            
            let scaleFactor = THREE.MathUtils.mapLinear(pinchDist, 0.03, 0.3, 0.5, 3);
            scaleFactor = THREE.MathUtils.clamp(scaleFactor, 0.5, 3);
            
            gsap.to(docGroup.scale, {
                x: scaleFactor,
                y: scaleFactor,
                z: scaleFactor,
                duration: 0.3
            });
            
            currentTextScale = scaleFactor;
            document.getElementById('text-body').style.fontSize = `${1 * currentTextScale}em`;
        }
    }

    // --- 19. 变形函数 ---
    function transformToSphere() {
        textMesh.visible = false;
        sphereMesh.visible = true;
        sphereMesh.scale.set(0.01, 0.01, 0.01);
        gsap.to(sphereMesh.scale, {x: 1, y: 1, z: 1, duration: 0.8, ease: "back.out(1.7)"});
        
        gsap.to('#text-content', {display: 'none', opacity: 0, duration: 0.3});
    }

    function transformToPlane() {
        sphereMesh.visible = false;
        textMesh.visible = true;
        textMesh.scale.set(0.01, 0.01, 0.01);
        gsap.to(textMesh.scale, {x: 1, y: 1, z: 1, duration: 0.8, ease: "back.out(1.7)"});
        
        gsap.to('#text-content', {display: 'block', opacity: 1, duration: 0.5, delay: 0.3});
    }

    // --- 20. 初始化 MediaPipe Hands ---
    const hands = new Hands({locateFile: (file) => {
        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
    }});
    hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
    });
    hands.onResults(onResults);

    const cameraFeed = new Camera(videoElement, {
        onFrame: async () => {
            await hands.send({image: videoElement});
        },
        width: 1280,
        height: 720
    });
    cameraFeed.start();

    // --- 21. 窗口调整 ---
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- 22. 初始化 ---
    updateDocumentDisplay(currentDocument);
    loadDocumentsList();
    
    gestureState.cursorPosition = {
        x: window.innerWidth / 2,
        y: window.innerHeight / 2
    };

    // 初始状态显示
    setTimeout(() => {
        document.getElementById('status-text').textContent = "系统就绪 - 使用手势控制";
    }, 2000);

</script>
</body>
